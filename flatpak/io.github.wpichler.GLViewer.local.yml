# Flatpak manifest used for the release bundles and local builds. GLViewer is
# built from source, offline: npm dependencies and the Electron runtime come
# from generated-sources.json (regenerate after changing package-lock.json:
#   flatpak-node-generator npm package-lock.json -o flatpak/generated-sources.json).
# Build with:
#   flatpak run org.flatpak.Builder --user --install --force-clean --install-deps-from=flathub \
#     build-flatpak flatpak/io.github.wpichler.GLViewer.local.yml
# Note: this file is not meant for a Flathub submission (see docs/flatpak-source-build.md).
app-id: io.github.wpichler.GLViewer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: glviewer
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # SSH: agent socket and read access to ~/.ssh (config, keys, known_hosts)
  - --socket=ssh-auth
  - --filesystem=~/.ssh:ro
  # /var/log browser and the persistent journal (read with the bundled journalctl);
  # other files are opened through the file chooser / document portal
  - --filesystem=/var/log:ro
  # volatile journal (systems without /var/log/journal)
  - --filesystem=/run/log/journal:ro
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  # journalctl, built from systemd and linked statically against systemd's
  # internal libraries, so the journal is read inside the sandbox.
  - name: journalctl
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/systemd/systemd/archive/refs/tags/v262.2.tar.gz
        sha256: 116432ee9dce9bfef4c7da7963c6de41899ab44197f2876ee99545707a5c7c1f
      # build-time only: systemd's build scripts need jinja2
      - type: archive
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
        dest: py/jinja2
      - type: archive
        url: https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz
        sha256: 2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6
        dest: py/markupsafe
    build-commands:
      - export PYTHONPATH="$PWD/py/jinja2/src:$PWD/py/markupsafe/src";
        meson setup _build --prefix=/app -Dmode=release -Dlink-journalctl-shared=false
        -Dtests=false -Dman=disabled -Dhtml=disabled -Dtranslations=false
      - export PYTHONPATH="$PWD/py/jinja2/src:$PWD/py/markupsafe/src"; ninja -C _build journalctl
      - install -Dm755 _build/journalctl /app/bin/journalctl
      # LICENSE.GPL2 / LICENSE.LGPL2.1 are installed by flatpak-builder automatically
      - mkdir -p /app/share/licenses/io.github.wpichler.GLViewer/journalctl
      - cp -r LICENSES /app/share/licenses/io.github.wpichler.GLViewer/journalctl/

  - name: glviewer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/glviewer/flatpak-node/cache
        npm_config_cache: /run/build/glviewer/flatpak-node/npm-cache
        npm_config_offline: 'true'
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    sources:
      - type: dir
        path: ..
        skip:
          - node_modules
          - dist
          - out
          - build-flatpak
          - .flatpak-builder
          - .flatpak-test
          - .flathub
          - .appimage-tools
          - .flatpak-repo
      - generated-sources.json
      - type: script
        dest-filename: glviewer.sh
        commands:
          - exec zypak-wrapper /app/glviewer/glviewer "$@"
    build-commands:
      # install scripts are not needed: native addons are excluded and the
      # Electron runtime comes from the offline cache
      - npm ci --offline --ignore-scripts
      - npx electron-vite build
      - . flatpak-node/electron-builder-arch-args.sh;
        npx electron-builder --linux dir $ELECTRON_BUILDER_ARCH_ARGS --publish never
      - cp -a dist/linux*-unpacked /app/glviewer
      - install -Dm755 glviewer.sh /app/bin/glviewer
      - install -Dm644 resources/icon.png /app/share/icons/hicolor/512x512/apps/io.github.wpichler.GLViewer.png
      - install -Dm644 flatpak/io.github.wpichler.GLViewer.svg /app/share/icons/hicolor/scalable/apps/io.github.wpichler.GLViewer.svg
      - install -Dm644 flatpak/io.github.wpichler.GLViewer.desktop /app/share/applications/io.github.wpichler.GLViewer.desktop
      - install -Dm644 flatpak/io.github.wpichler.GLViewer.metainfo.xml /app/share/metainfo/io.github.wpichler.GLViewer.metainfo.xml
      # LICENSE (MIT) is installed by flatpak-builder automatically
      - install -Dm644 -t /app/share/licenses/io.github.wpichler.GLViewer/electron /app/glviewer/LICENSE.electron.txt /app/glviewer/LICENSES.chromium.html
