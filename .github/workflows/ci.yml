name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Flatpak sources match package-lock.json
        run: |
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$(cat flatpak/generated-sources.lock-sha256)" \
            || { echo "::error::package-lock.json changed: run scripts/update-flatpak-sources.sh"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
