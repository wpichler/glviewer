name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "GLViewer $GITHUB_REF_NAME" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools zsync
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never
          npx electron-builder --linux AppImage tar.gz --arm64 --publish never
          # static runtime (no libfuse2), AppStream metainfo, update information + .zsync
          bash scripts/repack-appimage.sh dist/GLViewer-*-linux-x86_64.AppImage x86_64
          bash scripts/repack-appimage.sh dist/GLViewer-*-linux-arm64.AppImage aarch64
      - name: Keep unpacked x64 build for the Flatpak job
        if: runner.os == 'Linux'
        run: tar czf linux-unpacked.tgz -C dist linux-unpacked
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-unpacked
          path: linux-unpacked.tgz
          retention-days: 1
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.AppImage.zsync dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.exe dist/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-unpacked
      - run: mkdir -p dist && tar xzf linux-unpacked.tgz -C dist
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo build flatpak/io.github.wpichler.GLViewer.local.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "GLViewer-${GITHUB_REF_NAME}-x86_64.flatpak" io.github.wpichler.GLViewer
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: GLViewer-${{ github.ref_name }}-x86_64.flatpak
          retention-days: 1
  publish:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - run: gh release upload "$GITHUB_REF_NAME" GLViewer-*.flatpak --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
