name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "GLViewer $GITHUB_REF_NAME" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never
          npx electron-builder --linux AppImage tar.gz --arm64 --publish never
      - name: Keep unpacked x64 build for the Flatpak job
        if: runner.os == 'Linux'
        run: tar czf linux-unpacked.tgz -C dist linux-unpacked
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-unpacked
          path: linux-unpacked.tgz
          retention-days: 1
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.exe dist/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-unpacked
      - run: mkdir -p dist && tar xzf linux-unpacked.tgz -C dist
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: GLViewer-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: flatpak/io.github.wpichler.GLViewer.local.yml
          arch: x86_64
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: GLViewer-${{ github.ref_name }}-x86_64.flatpak
          retention-days: 1
  publish:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - run: gh release upload "$GITHUB_REF_NAME" GLViewer-*.flatpak --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
